<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DFC Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Permanent+Marker&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="lg" id="login">
      <form class="card lgf" id="lf">
        <img src="logo.png" alt="DFC" />
        <h1>Admin sign in</h1>
        <label
          >Username<input name="u" autocomplete="username" required
        /></label>
        <label
          >Password<input
            name="p"
            type="password"
            autocomplete="current-password"
            required
        /></label>
        <button class="btn">Sign in</button>
        <div class="err" id="le" role="alert"></div>
        <a href="index.html" class="mute">Back to website</a>
      </form>
    </div>

    <div id="app" hidden>
      <aside id="side">
        <div class="brand"><img src="logo.png" alt="" /><span>DFC</span></div>
        <nav>
          <button data-v="dashboard">Dashboard</button
          ><button data-v="members">Members</button>
          <button data-v="messages">Messages <b class="bd" id="mb"></b></button
          ><button data-v="updates">Updates</button>
          <button data-v="albums">Albums</button
          ><button data-v="hero">Hero images</button
          ><button data-v="profile">My profile</button>
        </nav>
        <a class="nv" href="index.html" target="_blank">View website</a
        ><button class="nv" data-a="out">Logout</button>
      </aside>
      <div class="main">
        <header class="top">
          <button class="ic burger" data-a="burger" aria-label="Menu">
            ☰
          </button>
          <h1 id="title">Dashboard</h1>
          <span class="sp"></span>
          <button class="ic" data-v="messages" aria-label="Messages">
            🔔<b class="bd red" id="bn"></b>
          </button>
          <button class="chip" data-v="profile">
            <i id="av">AD</i><span id="an">Admin</span>
          </button>
        </header>
        <main id="view"></main>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="data.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
